<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email preview</title>
<style>
  :root {
    --mat: #e4e8ee;        /* the table the proof sits on */
    --panel: #fbfcfd;
    --ink: #18202b;
    --quiet: #5b6676;
    --line: #cdd3db;
    --accent: #2450b8;     /* airmail blue */
    --accent-wash: #e3eafa;
    --warn: #8a4a00;
    --warn-wash: #fdf1dc;
    --bad: #a3221b;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --mat: #10151c; --panel: #1a212b; --ink: #e8ecf1; --quiet: #9aa5b4; --line: #313b49;
      --accent: #8fb0ff; --accent-wash: #22304d; --warn: #f2b860; --warn-wash: #33280f; --bad: #ff8f86;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: 100%;
    font: 14px/1.45 var(--sans); color: var(--ink); background: var(--mat);
  }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Template rail */
  .rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 8px; }
  .rail h1 { font-size: 13px; font-weight: 600; margin: 0 8px 2px; }
  .rail .scope { margin: 0 8px 14px; color: var(--quiet); font-size: 12px; }
  .rail ul { list-style: none; margin: 0; padding: 0; }
  .rail button {
    display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 7px 8px; border-radius: 6px; font: 12.5px/1.35 var(--mono); overflow-wrap: anywhere;
  }
  .rail button:hover { background: var(--mat); }
  .rail button[aria-current="true"] { background: var(--accent-wash); color: var(--accent); font-weight: 600; }

  .stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }

  /* Message header, laid out like the top of an opened email */
  .envelope {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 14px 20px 12px; display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1fr) auto; align-items: end;
  }
  .subject { font-size: 19px; font-weight: 650; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
  .subject.empty { color: var(--quiet); font-weight: 400; }
  .to { margin: 3px 0 0; color: var(--quiet); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
  .controls label { display: grid; gap: 2px; font-size: 11.5px; color: var(--quiet); }
  .controls select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 190px;
  }
  .widths { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; align-self: end; }
  .widths button { border: 0; background: var(--panel); padding: 6px 10px; cursor: pointer; border-right: 1px solid var(--line); }
  .widths button:last-child { border-right: 0; }
  .widths button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }

  .mat { overflow: auto; padding: 24px 16px; display: flex; justify-content: center; }
  .mat iframe {
    border: 0; background: #fff; width: 100%; height: 100%; min-height: 400px; flex: none;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .18), 0 12px 32px -12px rgba(16, 24, 40, .35);
  }
  .empty-state { align-self: center; max-width: 46ch; text-align: center; color: var(--quiet); }
  .empty-state code { font-family: var(--mono); color: var(--ink); }

  /* Status strip: size budget and anything the local render could not do */
  .status { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 20px; font-size: 12.5px; }
  .status .row { display: flex; gap: 16px; align-items: center; justify-content: space-between; color: var(--quiet); }
  .budget { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .budget meter { width: 120px; height: 8px; }
  .status ul { margin: 8px 0 2px; padding: 8px 12px 8px 28px; background: var(--warn-wash); color: var(--warn); border-radius: 6px; max-height: 120px; overflow-y: auto; }
  .status .bad { color: var(--bad); }
  .status details { margin-top: 6px; }
  .status summary { cursor: pointer; color: var(--warn); }
  .status details ul { margin-top: 6px; max-height: 160px; }
  .status details .line { font-family: var(--mono); margin-right: 6px; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2e9e5b; margin-right: 6px; }
  .live.off::before { background: var(--bad); }

  @media (max-width: 760px) {
    body { grid-template-columns: 100%; grid-template-rows: auto minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; max-height: 132px; }
    .rail h1, .rail .scope { display: inline; margin-right: 6px; }
    .envelope { grid-template-columns: 100%; }
    .controls { justify-content: flex-start; }
    .mat { padding: 12px 0; }
  }
</style>
</head>
<body>
  <nav class="rail" aria-label="Templates">
    <h1>Transactional emails</h1>
    <p class="scope" id="scope"></p>
    <ul id="list"></ul>
  </nav>

  <main class="stage">
    <header class="envelope">
      <div>
        <h2 class="subject" id="subject"></h2>
        <p class="to" id="to"></p>
      </div>
      <div class="controls">
        <label>Preview data <select id="fixture"></select></label>
        <label>Language <select id="locale"></select></label>
        <div class="widths" role="group" aria-label="Preview width">
          <button type="button" data-width="375">Phone</button>
          <button type="button" data-width="640">Desktop</button>
          <button type="button" data-width="0">Full</button>
        </div>
      </div>
    </header>

    <div class="mat" id="mat">
      <iframe id="frame" title="Rendered email" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>

    <footer class="status">
      <div class="row">
        <span class="live" id="live">Reloads when you save</span>
        <span class="budget" id="budget"></span>
      </div>
      <ul id="warnings" hidden></ul>
      <details id="compat" hidden>
        <summary id="compat-summary"></summary>
        <ul id="compat-list"></ul>
      </details>
    </footer>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const state = { type: null, fixture: 'default', locale: '', width: 640, templates: [] };

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('type')) state.type = p.get('type');
  if (p.get('fixture')) state.fixture = p.get('fixture');
  if (p.get('locale')) state.locale = p.get('locale');
  if (p.has('width')) state.width = Number(p.get('width'));
}
function writeHash() {
  const p = new URLSearchParams({ type: state.type || '', fixture: state.fixture, locale: state.locale, width: state.width });
  history.replaceState(null, '', '#' + p);
}
const query = () => new URLSearchParams({ type: state.type, fixture: state.fixture, locale: state.locale });

function fillSelect(el, values, current) {
  el.replaceChildren(...values.map((v) => new Option(v, v, false, v === current)));
  el.disabled = values.length < 2;
}

async function loadTemplates() {
  const data = await (await fetch('/api/templates')).json();
  state.templates = data.templates;
  $('scope').textContent = data.scope === 'global' ? 'Global templates' : 'Overrides for ' + data.scope.replace('-', ' ');
  if (!state.templates.some((t) => t.typeId === state.type)) state.type = state.templates[0]?.typeId || null;

  $('list').replaceChildren(...state.templates.map((t) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = t.name;
    b.title = t.folder;
    b.setAttribute('aria-current', String(t.typeId === state.type));
    b.onclick = () => { state.type = t.typeId; state.fixture = 'default'; refresh(true); };
    li.append(b);
    return li;
  }));

  const current = state.templates.find((t) => t.typeId === state.type);
  if (current) {
    if (!current.fixtures.includes(state.fixture)) state.fixture = current.fixtures[0] || 'default';
    if (!current.locales.includes(state.locale)) state.locale = current.locales.includes('en') ? 'en' : current.locales[0];
    fillSelect($('fixture'), current.fixtures.length ? current.fixtures : ['default'], state.fixture);
    fillSelect($('locale'), current.locales, state.locale);
  }
}

function applyWidth() {
  $('frame').style.width = state.width ? state.width + 'px' : '100%';
  document.querySelectorAll('.widths button').forEach((b) =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.width) === state.width)));
}

async function refresh(resetScroll) {
  await loadTemplates();
  writeHash();
  applyWidth();
  const mat = $('mat');
  const old = mat.querySelector('.empty-state');
  if (old) old.remove();

  if (!state.type) {
    $('frame').hidden = true;
    $('subject').textContent = '';
    $('to').textContent = '';
    $('budget').textContent = '';
    $('warnings').hidden = true;
    $('compat').hidden = true;
    const p = document.createElement('p');
    p.className = 'empty-state';
    p.innerHTML = 'No templates here yet. Run <code>email-builder create --all</code> to download them from your store.';
    mat.append(p);
    return;
  }
  $('frame').hidden = false;

  const meta = await (await fetch('/api/render?' + query())).json();
  const subject = $('subject');
  subject.textContent = meta.error ? 'This template did not render' : (meta.subject || 'No subject line');
  subject.classList.toggle('empty', !meta.subject && !meta.error);
  subject.classList.toggle('bad', Boolean(meta.error));
  $('to').textContent = meta.error ? '' : 'Rendered with ' + state.fixture + '.json in ' + (meta.locale || 'en');

  const over = meta.length > meta.limit;
  $('budget').innerHTML = '';
  const meter = document.createElement('meter');
  meter.max = meta.limit; meter.high = meta.limit * 0.9; meter.value = Math.min(meta.length, meta.limit);
  const label = document.createElement('span');
  label.textContent = meta.length.toLocaleString() + ' of ' + meta.limit.toLocaleString() + ' characters';
  label.classList.toggle('bad', over);
  $('budget').append(label, meter);

  const warnings = $('warnings');
  warnings.hidden = !meta.warnings.length;
  warnings.replaceChildren(...meta.warnings.map((w) => Object.assign(document.createElement('li'), { textContent: w })));

  const compat = meta.compat || [];
  $('compat').hidden = !compat.length && !meta.compatError;
  $('compat-summary').textContent = meta.compatError
    ? 'Email client check failed: ' + meta.compatError
    : compat.length + (compat.length === 1 ? ' feature is' : ' features are') + ' not supported by some email clients';
  $('compat-list').replaceChildren(...compat.map((c) => {
    const li = document.createElement('li');
    const line = Object.assign(document.createElement('span'), { className: 'line', textContent: c.line ? 'line ' + c.line : '' });
    li.append(line, c.title + ': ' + c.clients);
    return li;
  }));

  const frame = $('frame');
  let scroll = 0;
  try { scroll = resetScroll ? 0 : frame.contentWindow.scrollY; } catch {}
  frame.onload = () => { try { frame.contentWindow.scrollTo(0, scroll); } catch {} };
  frame.src = '/frame?' + query() + '&t=' + Date.now();
}

$('fixture').onchange = (e) => { state.fixture = e.target.value; refresh(true); };
$('locale').onchange = (e) => { state.locale = e.target.value; refresh(false); };
document.querySelectorAll('.widths button').forEach((b) => {
  b.onclick = () => { state.width = Number(b.dataset.width); writeHash(); applyWidth(); };
});

const events = new EventSource('/events');
events.addEventListener('change', () => refresh(false));
// Each run of the preview server names itself when the stream opens. A new name after reconnecting means it was
// restarted, perhaps as a newer version of the tool, so the page loads again from it.
let server = null;
events.addEventListener('hello', (e) => {
  if (server && server !== e.data) return location.reload();
  if (server) refresh(false); // the same server after a dropped connection: catch up on anything missed
  server = e.data;
});
events.onopen = () => { $('live').classList.remove('off'); $('live').textContent = 'Reloads when you save'; };
events.onerror = () => { $('live').classList.add('off'); $('live').textContent = 'Preview server stopped'; };

readHash();
refresh(true);
</script>
</body>
</html>
